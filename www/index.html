<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Счётчик калорий</title><style>
:root{--bg:#121212;--card:#1e1e1e;--accent:#bb86fc;--accent2:#03dac6;--text:#e0e0e0;--text2:#a0a0a0;--danger:#cf6679;--radius:12px}*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:16px}.app{width:100%;max-width:600px;display:flex;flex-direction:column;gap:16px}header{display:flex;justify-content:space-between;align-items:center;padding:8px 0}header h1{font-size:1.5rem;font-weight:600;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.date{color:var(--text2);font-size:.9rem}.tabs{display:flex;gap:8px;background:var(--card);padding:4px;border-radius:var(--radius)}.tab{flex:1;padding:12px;text-align:center;border-radius:8px;cursor:pointer;font-weight:500;color:var(--text2);transition:.2s;border:none;background:transparent;font-size:1rem}.tab.active{background:var(--accent);color:#000}.screen{display:none;flex-direction:column;gap:16px}.screen.active{display:flex}.card{background:var(--card);border-radius:var(--radius);padding:16px}.summary{text-align:center;padding:20px}.summary .label,.workout-summary .label{color:var(--text2);font-size:.9rem}.summary .value{font-size:2.5rem;font-weight:700;color:var(--accent)}.summary .unit{font-size:1rem;color:var(--text2)}.summary-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid #2a2a2a}.stat{text-align:center}.stat .lbl{font-size:.75rem;color:var(--text2)}.stat .val{font-size:1.2rem;font-weight:700;margin-top:2px}.stat-burn .val{color:var(--accent2)}.stat-diff .val{color:var(--accent)}.quality-header{display:flex;justify-content:space-between;margin-bottom:10px;align-items:center}.quality-label{font-size:.85rem;color:var(--text2)}.quality-verdict{font-weight:600;font-size:.9rem}.quality-bar{height:10px;background:#2a2a2a;border-radius:5px;overflow:hidden;display:flex}.quality-bar .healthy{background:var(--accent2);height:100%;transition:width .3s}.quality-bar .junk{background:var(--danger);height:100%;transition:width .3s}.quality-legend{display:flex;justify-content:space-between;margin-top:8px;font-size:.75rem;color:var(--text2)}.food-list{display:flex;flex-direction:column;gap:8px}.food-item{display:flex;align-items:center;justify-content:space-between;background:var(--card);padding:12px 16px;border-radius:var(--radius);border-left:4px solid var(--accent2)}.food-item.junk{border-left-color:var(--danger)}.food-item .info{display:flex;flex-direction:column;gap:4px;flex:1}.food-item .name{font-weight:500}.food-item .details{font-size:.85rem;color:var(--text2)}.food-item .calories{font-weight:700;color:var(--accent);white-space:nowrap}.delete-btn{background:transparent;border:none;color:var(--danger);cursor:pointer;font-size:1.2rem;padding:4px 8px;border-radius:6px;margin-left:8px}.delete-btn:hover{background:rgba(207,102,121,.2)}.add-btn{width:100%;padding:16px;background:var(--accent);color:#000;border:none;border-radius:var(--radius);font-size:1.1rem;font-weight:600;cursor:pointer;transition:.2s}.add-btn:hover{opacity:.9}.bottom-panels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto}.panel{background:var(--card);border-radius:var(--radius);padding:12px;text-align:center;cursor:pointer;border-bottom:3px solid transparent;transition:.2s}.panel:active{transform:scale(.98)}.panel.steps{border-bottom-color:var(--accent)}.panel.water{border-bottom-color:#2196f3}.panel.sleep{border-bottom-color:#9c27b0}.panel .icon{font-size:1.5rem}.panel .val{font-size:1.2rem;font-weight:700;margin:4px 0}.panel .lbl{font-size:.75rem;color:var(--text2)}.exercise-category{margin-bottom:16px}.exercise-category h3{font-size:1rem;color:var(--accent2);margin-bottom:8px;padding-left:4px}.exercise-item{display:flex;align-items:center;justify-content:space-between;background:var(--card);padding:12px 16px;border-radius:var(--radius);margin-bottom:6px}.ex-name{font-weight:500}.ex-type{font-size:.8rem;color:var(--text2)}.ex-btn{background:var(--accent2);color:#000;border:none;border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer}.ex-btn:hover{opacity:.9}.workout-summary{text-align:center;padding:20px}.workout-summary .value{font-size:2.2rem;font-weight:700;color:var(--accent2)}.feedback{margin-top:8px;font-size:1rem;font-weight:600}.done-list{display:flex;flex-direction:column;gap:6px}.done-item{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:10px 14px;border-radius:var(--radius);font-size:.9rem}.done-burn{color:var(--accent2);font-weight:600}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;justify-content:center;align-items:flex-end;padding:16px}.modal-overlay.active{display:flex}.modal{background:var(--card);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:600px;max-height:85vh;overflow-y:auto;padding:20px;animation:slideUp .3s ease}@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}.modal h2{margin-bottom:16px;font-size:1.3rem}.modal-close{float:right;background:none;border:none;color:var(--text2);font-size:1.5rem;cursor:pointer}.category-list,.product-list{display:flex;flex-direction:column;gap:8px}.cat-item,.prod-item{background:var(--bg);padding:14px 16px;border-radius:var(--radius);cursor:pointer;transition:.2s;border:1px solid transparent}.cat-item:hover,.prod-item:hover{border-color:var(--accent)}.prod-item{display:flex;justify-content:space-between}.amount-control{display:flex;align-items:center;gap:12px;margin:16px 0}.amount-control button{width:48px;height:48px;border-radius:50%;border:none;background:var(--accent);color:#000;font-size:1.5rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}.amount-control input{flex:1;background:var(--bg);border:1px solid #333;border-radius:var(--radius);padding:12px;color:var(--text);font-size:1.2rem;text-align:center}.amount-control input:focus{outline:none;border-color:var(--accent)}.calc-calories{text-align:center;font-size:1.2rem;margin:16px 0;color:var(--accent2)}.modal-actions{display:flex;gap:8px;margin-top:16px}.modal-actions button{flex:1;padding:14px;border-radius:var(--radius);border:none;font-size:1rem;font-weight:600;cursor:pointer}.btn-cancel{background:#333;color:var(--text)}.btn-confirm{background:var(--accent);color:#000}.hidden{display:none!important}.empty-msg{text-align:center;color:var(--text2);padding:24px;font-style:italic}
</style></head><body><div class="app"><header><h1>CalorieTracker</h1><span class="date" id="currentDate"></span></header><div class="tabs"><button class="tab active" data-tab="diary">Дневник</button><button class="tab" data-tab="exercises">Упражнения</button></div><div class="screen active" id="diaryScreen"><div class="card summary"><div class="label">Съедено сегодня</div><div class="value" id="totalCalories">0</div><div class="unit">ккал</div><div class="summary-stats"><div class="stat stat-burn"><div class="lbl">Сожжено</div><div class="val" id="burnedCalories">0 ккал</div></div><div class="stat stat-diff"><div class="lbl">Разница</div><div class="val" id="balanceCalories">0 ккал</div></div></div></div><div class="card"><div class="quality-header"><span class="quality-label">Качество рациона</span><span class="quality-verdict" id="qualityVerdict">—</span></div><div class="quality-bar"><div class="healthy" id="healthyBar" style="width:0%"></div><div class="junk" id="junkBar" style="width:0%"></div></div><div class="quality-legend"><span id="healthyText">Полезное: 0%</span><span id="junkText">Вредное: 0%</span></div></div><div class="food-list" id="foodList"></div><button class="add-btn" id="addFoodBtn">+ Добавить продукт</button><div class="bottom-panels"><div class="panel steps" id="panelSteps"><div class="icon">👣</div><div class="val" id="stepsVal">0</div><div class="lbl">шаги</div></div><div class="panel water" id="panelWater"><div class="icon">💧</div><div class="val" id="waterVal">0.0</div><div class="lbl">литры</div></div><div class="panel sleep" id="panelSleep"><div class="icon">😴</div><div class="val" id="sleepVal">0.0</div><div class="lbl">часы</div></div></div></div><div class="screen" id="exercisesScreen"><div class="card workout-summary"><div class="label">Сожжено на тренировке</div><div class="value" id="exerciseBurned">0 ккал</div><div class="feedback" id="exerciseFeedback">—</div></div><div id="exerciseList"></div><h3 style="color:var(--accent);margin-top:8px">Выполнено сегодня</h3><div class="done-list" id="doneList"></div></div></div>
<div class="modal-overlay" id="foodModal"><div class="modal"><button class="modal-close" id="closeFoodModal">&times;</button><h2 id="foodModalTitle">Добавить продукт</h2><div id="categoryStep"><div class="category-list" id="categoryList"></div></div><div id="productStep" class="hidden"><div class="product-list" id="productList"></div><button id="backToCategories" style="margin-top:12px;width:100%;padding:12px;border-radius:12px;border:none;background:#333;color:var(--text);cursor:pointer">← Назад к категориям</button></div><div id="amountStep" class="hidden"><div style="text-align:center;margin-bottom:8px" id="selectedProductName"></div><div class="amount-control"><button id="amountMinus">−</button><input type="number" id="amountInput" value="100" min="0" step="1"><button id="amountPlus">+</button></div><div style="text-align:center;color:var(--text2)" id="unitLabel">граммы</div><div class="calc-calories" id="calcCalories">0 ккал</div><div class="modal-actions"><button class="btn-cancel" id="cancelAmount">Отмена</button><button class="btn-confirm" id="confirmAmount">Добавить</button></div></div></div></div><div class="modal-overlay" id="inputModal"><div class="modal" style="max-width:400px;border-radius:12px;padding:24px"><h2 id="inputModalTitle">Введите значение</h2><div class="amount-control" style="margin:20px 0"><input type="number" id="inputModalValue" step="any" style="font-size:1.5rem;padding:16px"></div><div class="modal-actions"><button class="btn-cancel" id="inputModalCancel">Отмена</button><button class="btn-confirm" id="inputModalConfirm">OK</button></div></div></div><script>
const FOOD_DB={"Крупы и гарниры":[{id:"grechka",name:"Гречка",unit:"g",calories:110},{id:"ris",name:"Рис",unit:"g",calories:130},{id:"makarony",name:"Макароны",unit:"g",calories:150},{id:"pshenka",name:"Пшёнка",unit:"g",calories:120},{id:"ovsyanka",name:"Овсянка",unit:"g",calories:100}],"Белковое":[{id:"egg",name:"Яйцо отварное",unit:"pcs",calories:70},{id:"kotleta",name:"Котлета куриная жареная",unit:"pcs",calories:220},{id:"tvorog",name:"Творог 5%",unit:"g",calories:120},{id:"salat",name:"Салат овощной",unit:"g",calories:50},{id:"kurica",name:"Куриная грудка отварная",unit:"g",calories:165},{id:"ryba",name:"Рыба на пару",unit:"g",calories:130}],"Вредное":[{id:"sladosti",name:"Сладости (конфеты)",unit:"g",calories:400},{id:"chipsy",name:"Чипсы",unit:"g",calories:520},{id:"suhariki",name:"Сухарики",unit:"g",calories:450},{id:"shokolad",name:"Шоколад молочный",unit:"g",calories:550},{id:"pechenye",name:"Печенье",unit:"g",calories:450},{id:"morozhenoe",name:"Мороженое",unit:"g",calories:220},{id:"fries",name:"Картофель фри",unit:"g",calories:320},{id:"burger",name:"Бургер",unit:"pcs",calories:300},{id:"pizza",name:"Пицца",unit:"g",calories:270},{id:"ponchik",name:"Пончик",unit:"pcs",calories:400},{id:"gazirovka",name:"Газировка",unit:"ml",calories:42},{id:"energetik",name:"Энергетик",unit:"ml",calories:45},{id:"naggetsy",name:"Наггетсы",unit:"g",calories:280},{id:"batonchik",name:"Шоколадный батончик",unit:"pcs",calories:500}]};
const JUNK_CATEGORY="Вредное";
const EXERCISES_DB=[{id:"push_classic",name:"Отжимания классические",type:"reps",category:"Отжимания",burnPerRep:.5},{id:"push_wall",name:"Отжимания от стены",type:"reps",category:"Отжимания",burnPerRep:.15},{id:"push_knees",name:"Отжимания с колен",type:"reps",category:"Отжимания",burnPerRep:.3},{id:"pull_classic",name:"Подтягивания классические",type:"reps",category:"Подтягивания",burnPerRep:1},{id:"pull_australian",name:"Подтягивания австралийские",type:"reps",category:"Подтягивания",burnPerRep:.5},{id:"abs_crunch",name:"Скручивания",type:"reps",category:"Пресс и скручивания",burnPerRep:.25},{id:"abs_legraise",name:"Подъём ног",type:"reps",category:"Пресс и скручивания",burnPerRep:.4},{id:"plank_classic",name:"Планка классическая",type:"time",category:"Планка",burnPerMin:4},{id:"plank_side",name:"Планка боковая",type:"time",category:"Планка",burnPerMin:3}];
let state={date:"",foodEntries:[],exercisesDone:[],steps:0,water:0,sleep:0};
const $=id=>document.getElementById(id);
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function loadState(){const saved=localStorage.getItem("calorieAppState");if(saved){try{state=JSON.parse(saved)}catch(e){}}const today=todayStr();if(state.date!==today)state={date:today,foodEntries:[],exercisesDone:[],steps:0,water:0,sleep:0};saveState();renderAll()}
function saveState(){localStorage.setItem("calorieAppState",JSON.stringify(state))}
function formatDate(s){const[y,m,d]=s.split('-');return d+'.'+m+'.'+y}
function formatAmount(e){return e.amount+(e.unit==='g'?' г':e.unit==='ml'?' мл':' шт.')}
function renderAll(){$('currentDate').textContent=formatDate(state.date);renderFoodList();renderSummary();renderFoodQuality();renderBottomPanels();renderExercises();renderWorkoutSummary();renderDoneList()}
function getTotals(){const eaten=state.foodEntries.reduce((s,e)=>s+e.calories,0),burned=state.exercisesDone.reduce((s,e)=>s+(e.caloriesBurned||0),0);return{eaten,burned,diff:eaten-burned}}
function renderSummary(){const t=getTotals();$('totalCalories').textContent=Math.round(t.eaten);$('burnedCalories').textContent=Math.round(t.burned)+' ккал';$('balanceCalories').textContent=(t.diff>=0?'+':'')+Math.round(t.diff)+' ккал';$('balanceCalories').style.color=t.diff>0?'var(--danger)':'var(--accent2)'}
function renderFoodQuality(){const healthyCals=state.foodEntries.filter(e=>e.healthy).reduce((s,e)=>s+e.calories,0),junkCals=state.foodEntries.filter(e=>!e.healthy).reduce((s,e)=>s+e.calories,0),total=healthyCals+junkCals;const v=$('qualityVerdict');if(total===0){v.textContent='Нет данных';v.style.color='var(--text2)';$('healthyBar').style.width='0%';$('junkBar').style.width='0%';$('healthyText').textContent='Полезное: 0%';$('junkText').textContent='Вредное: 0%';return}const h=Math.round(healthyCals/total*100),j=100-h;$('healthyBar').style.width=h+'%';$('junkBar').style.width=j+'%';$('healthyText').textContent='Полезное: '+h+'%';$('junkText').textContent='Вредное: '+j+'%';let verdict,color;if(h>=70){verdict='Отличный рацион 💪';color='var(--accent2)'}else if(h>=40){verdict='Неплохо, но можно лучше 👍';color='#FFC107'}else if(h>=20){verdict='Многовато вредного ⚠️';color='#FF9800'}else{verdict='Слишком много вредной еды 🚫';color='var(--danger)'}v.textContent=verdict;v.style.color=color}
function renderFoodList(){$('foodList').innerHTML=state.foodEntries.map(e=>`<div class="food-item ${e.healthy?'':'junk'}" data-id="${e.id}"><div class="info"><span class="name">${e.name}</span><span class="details">${formatAmount(e)}</span></div><div style="display:flex;align-items:center;gap:8px"><span class="calories">${Math.round(e.calories)} ккал</span><button class="delete-btn" data-id="${e.id}">🗑️</button></div></div>`).join('')||'<div class="empty-msg">Пока ничего не съедено. Добавьте продукт!</div>'}
function renderBottomPanels(){$('stepsVal').textContent=state.steps;$('waterVal').textContent=state.water.toFixed(1);$('sleepVal').textContent=state.sleep.toFixed(1)}
function renderExercises(){$('exerciseList').innerHTML=[...new Set(EXERCISES_DB.map(e=>e.category))].map(cat=>`<div class="exercise-category"><h3>${cat}</h3>${EXERCISES_DB.filter(e=>e.category===cat).map(ex=>{const hint=ex.type==='reps'?`повторения · ≈${ex.burnPerRep} ккал/повт`:`время (мин) · ≈${ex.burnPerMin} ккал/мин`;return `<div class="exercise-item" data-exid="${ex.id}"><div><div class="ex-name">${ex.name}</div><div class="ex-type">${hint}</div></div><button class="ex-btn" data-exid="${ex.id}">Выполнить</button></div>`}).join('')}</div>`).join('')}
function renderWorkoutSummary(){const burned=state.exercisesDone.reduce((s,e)=>s+(e.caloriesBurned||0),0),count=state.exercisesDone.length;$('exerciseBurned').textContent=Math.round(burned)+' ккал';const fb=$('exerciseFeedback');if(count===0){fb.textContent='Пока нет тренировок сегодня 💤';fb.style.color='var(--text2)'}else if(burned<50){fb.textContent='Неплохое начало 💪';fb.style.color='#FFC107'}else if(burned<150){fb.textContent='Хорошая тренировка 🔥';fb.style.color='var(--accent2)'}else{fb.textContent='Отличная тренировка! 🔥🔥';fb.style.color='var(--accent)'}}
function renderDoneList(){$('doneList').innerHTML=state.exercisesDone.map(e=>`<div class="done-item" data-id="${e.id}"><span>${e.name}: <strong>${e.amount}</strong> ${e.type==='reps'?'повт.':'мин'} <span class="done-burn">(−${Math.round(e.caloriesBurned||0)} ккал)</span></span><button class="delete-btn" data-id="${e.id}">🗑️</button></div>`).join('')||'<div class="empty-msg">Нет выполненных упражнений</div>'}
let foodModalState={category:null,product:null,amount:100};
function openFoodModal(){foodModalState={category:null,product:null,amount:100};$('foodModal').classList.add('active');showCategoryStep()}
function closeFoodModal(){$('foodModal').classList.remove('active')}
function showStep(id){['categoryStep','productStep','amountStep'].forEach(s=>$(s).classList.toggle('hidden',s!==id))}
function showCategoryStep(){showStep('categoryStep');$('foodModalTitle').textContent='Выберите категорию';$('categoryList').innerHTML=Object.keys(FOOD_DB).map(cat=>`<div class="cat-item" data-cat="${cat}">${cat}</div>`).join('')}
function showProductStep(category){foodModalState.category=category;showStep('productStep');$('foodModalTitle').textContent=category;$('productList').innerHTML=FOOD_DB[category].map(p=>{const u=p.unit==='g'?'ккал/100г':p.unit==='ml'?'ккал/100мл':'ккал/шт';return `<div class="prod-item" data-prodid="${p.id}"><span>${p.name}</span><span style="color:var(--text2);font-size:.9rem">${p.calories} ${u}</span></div>`}).join('')}
function showAmountStep(p){foodModalState.product=p;foodModalState.amount=p.unit==='g'||p.unit==='ml'?100:1;showStep('amountStep');$('foodModalTitle').textContent=p.name;$('selectedProductName').textContent=p.name;$('unitLabel').textContent=p.unit==='g'?'граммы':p.unit==='ml'?'миллилитры':'штуки';$('amountInput').value=foodModalState.amount;$('amountInput').step=p.unit==='g'||p.unit==='ml'?10:1;updateCalcCalories()}
function updateCalcCalories(){const p=foodModalState.product;if(!p)return;const a=parseFloat($('amountInput').value)||0;foodModalState.amount=a;$('calcCalories').textContent=Math.round(p.unit==='g'||p.unit==='ml'?a/100*p.calories:a*p.calories)+' ккал'}
$('addFoodBtn').addEventListener('click',openFoodModal);$('closeFoodModal').addEventListener('click',closeFoodModal);$('backToCategories').addEventListener('click',showCategoryStep);$('cancelAmount').addEventListener('click',closeFoodModal);
$('categoryList').addEventListener('click',e=>{const t=e.target.closest('.cat-item');if(t)showProductStep(t.dataset.cat)});
$('productList').addEventListener('click',e=>{const t=e.target.closest('.prod-item');if(t){const p=FOOD_DB[foodModalState.category].find(p=>p.id===t.dataset.prodid);if(p)showAmountStep(p)}});
$('amountMinus').addEventListener('click',()=>{const p=foodModalState.product,i=$('amountInput'),step=p.unit==='g'||p.unit==='ml'?10:1;i.value=Math.max(0,(parseFloat(i.value)||0)-step);updateCalcCalories()});
$('amountPlus').addEventListener('click',()=>{const p=foodModalState.product,i=$('amountInput'),step=p.unit==='g'||p.unit==='ml'?10:1;i.value=(parseFloat(i.value)||0)+step;updateCalcCalories()});$('amountInput').addEventListener('input',updateCalcCalories);
$('confirmAmount').addEventListener('click',()=>{const p=foodModalState.product;if(!p)return;const amount=parseFloat($('amountInput').value)||0;if(amount<=0)return;const calories=p.unit==='g'||p.unit==='ml'?amount/100*p.calories:amount*p.calories;state.foodEntries.push({id:Date.now()+'-'+Math.random(),foodId:p.id,name:p.name,amount,unit:p.unit,calories,healthy:foodModalState.category!==JUNK_CATEGORY});saveState();renderAll();closeFoodModal()});
$('foodList').addEventListener('click',e=>{const b=e.target.closest('.delete-btn');if(b){state.foodEntries=state.foodEntries.filter(x=>x.id!==b.dataset.id);saveState();renderAll()}});
let inputModalCallback=null;function openInputModal(title,currentValue,step,callback){$('inputModalTitle').textContent=title;const i=$('inputModalValue');i.value=currentValue;i.step=step;inputModalCallback=callback;$('inputModal').classList.add('active');i.focus()}
function closeInputModal(){$('inputModal').classList.remove('active');inputModalCallback=null}
$('inputModalCancel').addEventListener('click',closeInputModal);$('inputModalConfirm').addEventListener('click',()=>{if(inputModalCallback){const v=parseFloat($('inputModalValue').value);if(!isNaN(v))inputModalCallback(v)}closeInputModal()});
$('panelSteps').addEventListener('click',()=>openInputModal('Шаги',state.steps,100,v=>{state.steps=Math.max(0,Math.round(v));saveState();renderBottomPanels()}));
$('panelWater').addEventListener('click',()=>openInputModal('Вода (литры)',state.water,.25,v=>{state.water=Math.max(0,parseFloat(v.toFixed(2)));saveState();renderBottomPanels()}));
$('panelSleep').addEventListener('click',()=>openInputModal('Сон (часы)',state.sleep,.5,v=>{state.sleep=Math.max(0,parseFloat(v.toFixed(1)));saveState();renderBottomPanels()}));
$('exerciseList').addEventListener('click',e=>{const b=e.target.closest('.ex-btn');if(!b)return;const ex=EXERCISES_DB.find(x=>x.id===b.dataset.exid);if(!ex)return;const reps=ex.type==='reps';openInputModal(reps?`Повторения для «${ex.name}»`:`Время в минутах для «${ex.name}»`,reps?10:1,reps?1:.5,v=>{if(v<=0)return;const burned=reps?v*ex.burnPerRep:v*ex.burnPerMin;state.exercisesDone.push({id:Date.now()+'-'+Math.random(),exerciseId:ex.id,name:ex.name,amount:v,type:ex.type,caloriesBurned:burned});saveState();renderAll()})});
$('doneList').addEventListener('click',e=>{const b=e.target.closest('.delete-btn');if(b){state.exercisesDone=state.exercisesDone.filter(x=>x.id!==b.dataset.id);saveState();renderAll()}});
document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));tab.classList.add('active');$(tab.dataset.tab+'Screen').classList.add('active')}));
loadState();setInterval(()=>{if(state.date!==todayStr())loadState()},60000);
</script></body></html>
