name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Create iOS project if missing
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios

      - name: Build unsigned iOS device app
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            build
          mkdir -p ipa/Payload
          cp -R build-device/Build/Products/Release-iphoneos/App.app ipa/Payload/
          cd ipa
          zip -r ../AppCreator-unsigned.ipa Payload

      - name: Build for iOS simulator
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload unsigned IPA package
        uses: actions/upload-artifact@v4
        with:
          name: AppCreator-iOS-unsigned-IPA
          path: AppCreator-unsigned.ipa
          if-no-files-found: error

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: AppCreator-iOS-simulator
          path: build-simulator/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
